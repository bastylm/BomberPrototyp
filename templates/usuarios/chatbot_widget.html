<div class="erpbot{% if request.resolver_match.url_name == 'mantenimiento' %} erpbot-maintenance{% endif %}" data-endpoint="{% url 'chatbot_api' %}">
    <button class="erpbot-toggle" type="button" aria-label="Abrir asistente" title="Arrastra para mover el botón" aria-expanded="false" aria-controls="erpbot-panel">
        <i class="bi bi-chat-dots-fill" aria-hidden="true"></i>
    </button>
    <section class="erpbot-panel" id="erpbot-panel" aria-label="Asistente del sistema" hidden>
        <header class="erpbot-header">
            <div><strong>Asistente del sistema</strong><small>Respuestas por guías y consultas autorizadas</small></div>
            <button class="erpbot-close" type="button" aria-label="Cerrar asistente">×</button>
        </header>
        <div class="erpbot-messages" role="log" aria-live="polite" aria-relevant="additions">
            <div class="erpbot-message erpbot-answer">Hola. Puedo mostrar guías y consultar datos de los módulos a los que tienes acceso.</div>
        </div>
        <form class="erpbot-form" method="post">
            {% csrf_token %}
            <label class="visually-hidden" for="erpbot-input">Escribe tu pregunta</label>
            <input id="erpbot-input" name="message" maxlength="500" autocomplete="off" placeholder="Escribe tu pregunta…" required>
            <button type="submit" aria-label="Enviar pregunta"><i class="bi bi-send-fill" aria-hidden="true"></i></button>
        </form>
    </section>
</div>

<style>
    .erpbot { position: fixed; right: 1.25rem; bottom: 1.25rem; z-index: 1040; font-family: inherit; }
    .erpbot.erpbot-maintenance { bottom: 5.25rem; }
    .erpbot-toggle { width: 3.5rem; height: 3.5rem; border: 0; border-radius: 50%; color: #fff; background: #dc3545; box-shadow: 0 4px 16px #0003; font-size: 1.35rem; cursor: grab; touch-action: none; user-select: none; }
    .erpbot-toggle:active { cursor: grabbing; }
    .erpbot-toggle:hover { background: #bb2d3b; }
    .erpbot-panel { position: absolute; right: 0; bottom: 4.25rem; display: flex; flex-direction: column; width: min(24rem, calc(100vw - 2rem)); height: min(34rem, calc(100vh - 7rem)); overflow: hidden; background: var(--bs-body-bg, #fff); color: var(--bs-body-color, #212529); border: 1px solid var(--bs-border-color, #dee2e6); border-radius: 1rem; box-shadow: 0 10px 34px #0003; }
    .erpbot-panel.erpbot-panel-down { top: 4.25rem; bottom: auto; }
    .erpbot-panel.erpbot-panel-align-left { left: 0; right: auto; }
    .erpbot-panel.erpbot-panel-align-right { left: auto; right: 0; }
    .erpbot-panel[hidden] { display: none; }
    .erpbot-header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .9rem 1rem; color: white; background: #dc3545; }
    .erpbot-header small { display: block; opacity: .88; font-size: .72rem; margin-top: .15rem; }
    .erpbot-close { border: 0; background: transparent; color: white; font-size: 1.6rem; line-height: 1; }
    .erpbot-messages { flex: 1; min-height: 0; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; align-items: flex-start; gap: .65rem; }
    .erpbot-message { max-width: 92%; padding: .65rem .8rem; border-radius: .8rem; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .9rem; }
    .erpbot-answer { background: var(--bs-tertiary-bg, #f1f3f5); }
    .erpbot-question { align-self: flex-end; background: #dc3545; color: white; }
    .erpbot-action { display: inline-block; margin-top: .6rem; color: #dc3545; font-weight: 600; }
    .erpbot-form { display: flex; gap: .5rem; padding: .75rem; border-top: 1px solid var(--bs-border-color, #dee2e6); }
    .erpbot-form input { min-width: 0; flex: 1; padding: .6rem .75rem; border: 1px solid var(--bs-border-color, #ced4da); border-radius: .6rem; background: var(--bs-body-bg, #fff); color: var(--bs-body-color, #212529); }
    .erpbot-form button { width: 2.6rem; border: 0; border-radius: .6rem; color: #fff; background: #dc3545; }
    .erpbot-form button:disabled { opacity: .6; }
    @media (max-width: 480px) { .erpbot { right: .75rem; bottom: .75rem; } .erpbot.erpbot-maintenance { bottom: 5.25rem; } .erpbot-panel { right: -.15rem; bottom: 4rem; width: calc(100vw - 1.5rem); height: min(32rem, calc(100dvh - 5.5rem)); } }
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const root = document.querySelector('.erpbot');
    if (!root) return;
    const toggle = root.querySelector('.erpbot-toggle');
    const panel = root.querySelector('.erpbot-panel');
    const close = root.querySelector('.erpbot-close');
    const form = root.querySelector('.erpbot-form');
    const input = root.querySelector('#erpbot-input');
    const messages = root.querySelector('.erpbot-messages');
    const positionStorageKey = 'bomberprototyp-chatbot-position-v1';
    const dragThreshold = 5;
    let customPosition = false;
    let dragState = null;
    let suppressClickUntil = 0;

    function clampPosition(left, top) {
        const margin = 12;
        const maxLeft = Math.max(margin, window.innerWidth - toggle.offsetWidth - margin);
        const maxTop = Math.max(margin, window.innerHeight - toggle.offsetHeight - margin);
        return {
            left: Math.max(margin, Math.min(left, maxLeft)),
            top: Math.max(margin, Math.min(top, maxTop))
        };
    }

    function applyPosition(left, top) {
        const position = clampPosition(left, top);
        root.style.left = `${position.left}px`;
        root.style.top = `${position.top}px`;
        root.style.right = 'auto';
        root.style.bottom = 'auto';
        customPosition = true;
        if (!panel.hidden) positionPanel();
    }

    function savePosition() {
        if (!customPosition) return;
        const rect = toggle.getBoundingClientRect();
        try {
            localStorage.setItem(positionStorageKey, JSON.stringify({ left: rect.left, top: rect.top }));
        } catch (_) {}
    }

    function loadPosition() {
        try {
            const saved = JSON.parse(localStorage.getItem(positionStorageKey) || 'null');
            if (saved && Number.isFinite(saved.left) && Number.isFinite(saved.top)) applyPosition(saved.left, saved.top);
        } catch (_) {}
    }

    function positionPanel() {
        const rect = toggle.getBoundingClientRect();
        const gap = 12;
        const spaceAbove = Math.max(0, rect.top - gap);
        const spaceBelow = Math.max(0, window.innerHeight - rect.bottom - gap);
        const openDown = spaceBelow >= spaceAbove;
        const availableHeight = openDown ? spaceBelow : spaceAbove;
        const panelHeight = Math.max(1, Math.min(544, availableHeight));
        const panelWidth = Math.min(384, Math.max(240, window.innerWidth - 32));
        const alignLeft = rect.left + panelWidth <= window.innerWidth - 12;

        panel.classList.toggle('erpbot-panel-down', openDown);
        panel.classList.toggle('erpbot-panel-align-left', alignLeft);
        panel.classList.toggle('erpbot-panel-align-right', !alignLeft);
        panel.style.height = `${panelHeight}px`;
    }

    loadPosition();
    toggle.addEventListener('pointerdown', function (event) {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        const rect = toggle.getBoundingClientRect();
        dragState = { pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, left: rect.left, top: rect.top, moved: false };
        toggle.setPointerCapture(event.pointerId);
    });
    toggle.addEventListener('pointermove', function (event) {
        if (!dragState || dragState.pointerId !== event.pointerId) return;
        const deltaX = event.clientX - dragState.startX;
        const deltaY = event.clientY - dragState.startY;
        if (!dragState.moved && Math.hypot(deltaX, deltaY) < dragThreshold) return;
        dragState.moved = true;
        event.preventDefault();
        applyPosition(dragState.left + deltaX, dragState.top + deltaY);
    });
    function finishDrag(event) {
        if (!dragState || dragState.pointerId !== event.pointerId) return;
        if (dragState.moved) {
            savePosition();
            suppressClickUntil = Date.now() + 350;
        }
        dragState = null;
    }
    toggle.addEventListener('pointerup', finishDrag);
    toggle.addEventListener('pointercancel', finishDrag);
    window.addEventListener('resize', function () {
        if (customPosition) {
            const rect = toggle.getBoundingClientRect();
            applyPosition(rect.left, rect.top);
            savePosition();
        }
        if (!panel.hidden) positionPanel();
    });

    function setOpen(open) {
        panel.hidden = !open;
        if (open) positionPanel();
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? 'Cerrar asistente' : 'Abrir asistente');
        if (open) input.focus();
    }
    function addMessage(text, kind, action) {
        const bubble = document.createElement('div');
        bubble.className = 'erpbot-message ' + (kind === 'question' ? 'erpbot-question' : 'erpbot-answer');
        bubble.textContent = text;
        if (action && action.url && action.label) {
            try {
                const url = new URL(action.url, window.location.origin);
                if (url.origin === window.location.origin) {
                    const link = document.createElement('a');
                    link.className = 'erpbot-action d-block';
                    link.href = url.href;
                    link.textContent = action.label;
                    bubble.appendChild(link);
                }
            } catch (_) {}
        }
        messages.appendChild(bubble);
        messages.scrollTop = messages.scrollHeight;
    }

    toggle.addEventListener('click', function () {
        if (Date.now() < suppressClickUntil) return;
        setOpen(panel.hidden);
    });
    close.addEventListener('click', () => setOpen(false));
    form.addEventListener('submit', async function (event) {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        const formData = new URLSearchParams(new FormData(form));
        addMessage(message, 'question');
        input.value = '';
        const submit = form.querySelector('button[type="submit"]');
        submit.disabled = true;
        try {
            const response = await fetch(root.dataset.endpoint, {
                method: 'POST',
                headers: { 'X-Requested-With': 'XMLHttpRequest' },
                body: formData,
                credentials: 'same-origin'
            });
            const data = await response.json();
            addMessage(data.text || 'No fue posible obtener una respuesta.', 'answer', data.action);
        } catch (_) {
            addMessage('No se pudo conectar con el asistente. Inténtalo nuevamente.', 'answer');
        } finally {
            submit.disabled = false;
            input.focus();
        }
    });
});
</script>
